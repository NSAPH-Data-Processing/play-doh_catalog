name: Rebuild catalog site

# Manually triggered from the Actions tab - see context/decisions.md for
# why this is a human clicking "Run workflow" rather than an automated
# Sheet-edit hook (an earlier Apps Script design was dropped as
# unnecessary complexity for a low-frequency review process).
on:
  workflow_dispatch: {}

# A stray double-click shouldn't queue two overlapping runs. Each run now
# cuts its own branch (see below), so this is just about avoiding
# redundant work/duplicate issues, not protecting a shared branch.
concurrency:
  group: catalog-rebuild
  cancel-in-progress: false

jobs:
  rebuild-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pip-only, no conda/datalad-metalad - confirmed sufficient for
      # catalog-create/validate/add/set (context/decisions.md).
      - name: Install dependencies
        run: pip install google-api-python-client google-auth datalad-catalog pyyaml

      - name: Write service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"

      # A fresh branch every run, cut from the current tip of main - no
      # reset/force-push dance needed since nothing else ever pushes here.
      - name: Create this run's branch
        run: git checkout -b "catalog-update-${{ github.run_number }}" main

      # spreadsheet ID / range come from sheet_config.yaml (committed, not
      # secret - see decisions.md), not from env vars here.
      # CATALOG_DIFF_SUMMARY_PATH makes build_site.py also write a
      # markdown added/removed/modified summary, used below for the
      # rebuild Issue's body (context/decisions.md).
      - name: Rebuild catalog site
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ format('{0}/service-account.json', runner.temp) }}
          CATALOG_DIFF_SUMMARY_PATH: ${{ format('{0}/catalog_diff_summary.md', runner.temp) }}
        run: python -m play_doh_catalog.build_site

      - name: Remove credentials file
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"

      - name: Stage rebuilt site
        id: stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site catalog_state.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # One Issue per run, listing what actually changed - gives each
      # rebuild its own audit trail instead of bundling multiple dataset
      # changes into one long-lived PR (context/decisions.md). The
      # "Fixes #<n>" in the commit message links the issue immediately
      # (visible on its timeline without needing a PR), and since GitHub
      # pre-fills a PR's body from the branch's sole commit, clicking
      # "Compare & pull request" carries that same "Fixes #<n>" into the
      # PR too, so merging auto-closes the issue.
      - name: Open rebuild issue and commit
        id: commit
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_url=$(gh issue create \
            --title "Catalog rebuild #${{ github.run_number }}" \
            --body-file "$RUNNER_TEMP/catalog_diff_summary.md")
          issue_number=$(basename "$issue_url")
          git commit -m "Rebuild catalog site" -m "Fixes #${issue_number}"

      - name: Push this run's branch
        if: steps.stage.outputs.changed == 'true'
        run: git push origin "catalog-update-${{ github.run_number }}"
